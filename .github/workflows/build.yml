name: Build

# Every push to main builds the app and publishes it as a GitHub Release, so
# there is always a downloadable APK on the Releases page. Pull requests run the
# same checks and stop there — nothing is published from a branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: only the release job needs to write.
permissions:
  contents: read

# A second push cancels the first run instead of queueing behind it. Nobody
# wants the APK from three commits ago.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `stable`: a Flutter release landing mid-week should not be able
  # to turn a green build red without a commit. Bump it deliberately.
  FLUTTER_VERSION: 3.47.8

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Golden bitmaps are generated on linux/arm64 and CI rasterises on
      # x86_64, so they are excluded here and reviewed locally instead. The
      # layout tests (320 dp, 200% text) still run, and they catch overflow.
      - name: Test
        run: flutter test --exclude-tags golden

  apk:
    name: Release APK and AAB
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      # Flutter drives the Android build through Gradle, which needs a JDK on
      # the runner before the Flutter toolchain is installed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Release signing. The keystore lives in repository secrets as base64; it is
      # decoded into the runner's temp dir and never written into the checkout.
      # Without the secrets (pull requests from forks, a repo not yet set up) the
      # build falls back to the debug key, which Play will reject, and says so.
      - name: Release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore found: building with the upload key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: building with the DEBUG key. This build cannot go to Play."
          fi

      # One APK per ABI: the arm64 build is a third of the size of a fat APK,
      # which matters when every upgrade is a manual download.
      # --build-number sets versionCode: the run number only goes up, which is
      # all Play asks of it. versionName stays the pubspec version.
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      # The App Bundle is what Play takes; Play makes the per-device APKs.
      - name: Build release App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  # Build results only. Issue, pull-request and release activity comes from the
  # repository webhook instead — GitHub posts it straight to the same Discord
  # channel through its `/github` endpoint, so there is no workflow to maintain
  # and nothing to duplicate.
  #
  # This job stays because a failed build deserves a message that links the run
  # and names which job broke, which a generic GitHub payload cannot express.
  # `nofail` and `ack_no_webhook` are on by default: without the secret this job
  # passes silently instead of turning an unrelated run red.
  notify:
    name: Discord
    needs: [check, apk]
    if: always() && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Notify failure
        uses: sarisia/actions-status-discord@v1
        with:
          status: failure
          title: "${{ github.repository }} · checks failed"
          description: |
            `${{ github.ref_name }}` — analyze+test: ${{ needs.check.result }}, apk: ${{ needs.apk.result }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: DharmaScroll CI
          nodetail: true
          notimestamp: true
          ack_no_webhook: true

  release:
    name: Publish release
    needs: apk
    # A pull request is a check, not a release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Read name and version from pubspec
        id: app
        run: |
          echo "name=$(sed -n 's/^name: *//p' pubspec.yaml | head -1)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: apk-${{ github.sha }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: aab-${{ github.sha }}
          path: dist-aab

      # `app-arm64-v8a-release.apk` says nothing to someone scrolling a release
      # page; `dharmascroll-0.1.0-arm64-v8a.apk` says which build and which phone.
      - name: Name the APKs
        run: |
          cd dist
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "${{ steps.app.outputs.name }}-${{ steps.app.outputs.version }}-${abi}.apk"
          done
          # Only a bundle signed with the upload key is worth attaching.
          if [ "${{ needs.apk.outputs.signed }}" = "true" ]; then
            mv ../dist-aab/app-release.aab "${{ steps.app.outputs.name }}-${{ steps.app.outputs.version }}-${{ github.run_number }}.aab"
          fi
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.app.outputs.version }}-${{ github.run_number }}"
          # Re-running a workflow reuses its run number, so the tag can already
          # exist. Replace it rather than failing the build over it.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          shopt -s nullglob
          FILES=(dist/*.apk dist/*.aab)
          gh release create "$TAG" "${FILES[@]}" \
            --title "v${{ steps.app.outputs.version }} · build ${{ github.run_number }}" \
            --generate-notes \
            --latest
