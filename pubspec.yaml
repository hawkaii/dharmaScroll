name: dharmascroll
description: "DharmaScroll — a gamified Bhagavad Gita companion for Bharat. Scroll shlokas, speak your day, earn Moksh Points."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  go_router: ^18.1.0
  shared_preferences: ^2.5.0
  lottie: ^3.1.0
  smooth_page_indicator: ^3.0.0
  fl_chart: ^0.69.0
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  flutter_svg: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/svg/icons/
  fonts:
    - family: NotoSerifDevanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari-Regular.ttf
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond12-Regular.ttf
        - asset: assets/fonts/EBGaramond12-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
