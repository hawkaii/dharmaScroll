name: dharmascroll
description: "DharmaScroll — a gamified Bhagavad Gita companion for Bharat. Scroll shlokas, speak your day, earn Moksh Points."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  go_router: ^18.1.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: TiroDevaSanskrit
      fonts:
        - asset: assets/fonts/TiroDevanagariSanskrit-Regular.ttf
    - family: TiroDevaHindi
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
